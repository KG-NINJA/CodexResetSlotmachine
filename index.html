<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#12000e">
    <title>CODEX 超覚醒 SLOT</title>
    <link rel="stylesheet" href="style.css">
    <script type="importmap">
    {
        "imports": {
            "three": "./vendor/three/three.module.js",
            "three/addons/": "./vendor/three/addons/"
        }
    }
    </script>
</head>
<body>
    <div class="parlor-bg" aria-hidden="true"></div>
    <div id="flash-overlay"></div>
    <div id="speed-lines"></div>
    <div id="impact-ring" aria-hidden="true"></div>

    <main class="machine" id="machine">
        <div class="side-lamps left" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
        <div class="side-lamps right" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>

        <header class="marquee">
            <div class="marquee-kicker">限界突破 × 超高確</div>
            <h1><span>CODEX</span> 超覚醒</h1>
            <div class="marquee-sub">PREMIUM BONUS SLOT</div>
        </header>

        <section class="data-panel" aria-label="ゲームデータ">
            <div><small>BIG</small><strong>77</strong></div>
            <div><small>REG</small><strong>33</strong></div>
            <div class="graph"><span>本日の履歴</span><svg viewBox="0 0 160 34" aria-hidden="true"><polyline points="0,30 18,27 35,29 52,20 70,24 88,12 105,17 124,5 142,10 160,1"/></svg></div>
            <div><small>GAME</small><strong id="game-count">000</strong></div>
        </section>

        <section class="reel-stage">
            <div class="chance-lamp" id="chance-lamp"><span>CHANCE</span><strong>激熱</strong></div>
            <div class="reel-bezel">
                <div class="payline top"></div>
                <div class="payline center"><span>WIN</span></div>
                <div class="payline bottom"></div>
                <div id="three-container" aria-label="3Dスロットリール"></div>
                <div class="reel-glass" aria-hidden="true"></div>
                <div class="countdown" id="countdown" aria-live="assertive"></div>
            </div>
            <div class="reel-caption"><span>★</span> BONUS CHANCE <span>★</span></div>
        </section>

        <section class="console">
            <div class="credit"><small>CREDIT</small><strong>50</strong></div>
            <div class="status-message" id="status-text">レバーを叩け！</div>
            <div class="payout"><small>PAY OUT</small><strong id="payout-count">00</strong></div>
            <div class="stop-row" aria-hidden="true">
                <button class="stop-button" id="stop-0" tabindex="-1"><span>1</span></button>
                <button class="stop-button" id="stop-1" tabindex="-1"><span>2</span></button>
                <button class="stop-button" id="stop-2" tabindex="-1"><span>3</span></button>
            </div>
            <div class="control-row">
                <div class="bet-button">MAX<br><small>BET</small></div>
                <button class="spin-btn" id="spin-button"><span class="lever-ball"></span><strong>レバー<br>ON</strong></button>
                <div class="medal-slot">●<small>MEDAL</small></div>
            </div>
        </section>
    </main>

    <div class="mega-message" id="mega-message" aria-live="assertive">
        <small>最終リール</small><strong>運命を<br>ねじ伏せろ！</strong>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
